plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.moonshinestt'
version = '0.1.0'

android {
  namespace "expo.modules.moonshinestt"
  defaultConfig {
    minSdkVersion 26
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  implementation 'ai.moonshine:moonshine-voice:0.1.5'
}
